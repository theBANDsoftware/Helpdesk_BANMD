spring.application.name=helpdesk

# Databasuppgifterna läses från filen backend/helpdesk/.env, som inte finns i repot.
# Kopiera .env.example till .env i samma mapp och fyll i. Miljövariabler
# med samma namn fungerar också och går före filen. Den andra sökvägen gör att
# filen hittas även om backend startas från repots rotmapp (t.ex. i IntelliJ).
spring.config.import=optional:file:.env[.properties],optional:file:backend/helpdesk/.env[.properties]

spring.datasource.url=jdbc:mariadb://${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Vänta max 5 sekunder på databasen, så att ett fel syns direkt i stället för efter 30.
spring.datasource.hikari.connection-timeout=5000

# Hibernate skapar eller ändrar inga tabeller. Tabellerna skapas med SQL-skripten
# i database/, som David kör på VPS:en (beslut 8).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Starta även om databasen inte svarar just då (t.ex. om VPS:en är nere). Då
# svarar anropen med 503 i stället för att backend kraschar vid start.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Hibernate varnar för att dialekten inte behöver anges, men utan den startar
# backend inte när databasen är nere. Varningen stängs därför av.
logging.level.org.hibernate.orm.deprecation=error
