spring.application.name=helpdesk

# Databasuppgifterna läses från filen backend/.env, som inte finns i repot.
# Kopiera backend/.env.example till backend/.env och fyll i. Miljövariabler
# med samma namn fungerar också och går före filen.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Vänta max 5 sekunder på databasen, så att ett fel syns direkt i stället för efter 30.
spring.datasource.hikari.connection-timeout=5000

# Hibernate skapar eller ändrar inga tabeller. Hur tabellerna ska skapas
# är en öppen fråga, se docs/databasschema.md.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Starta även om databasen inte svarar just då (t.ex. om VPS:en är nere). Då
# visar /api/health felet i stället för att backend kraschar vid start.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Hibernate varnar för att dialekten inte behöver anges, men utan den startar
# backend inte när databasen är nere. Varningen stängs därför av.
logging.level.org.hibernate.orm.deprecation=error
